[project]
name = "wisp-daemon"
version = "0.1.0"
description = "Backend for the wisp overlay: audio capture, streaming STT, LLM streaming"
requires-python = ">=3.13"
dependencies = [
    "sherpa-onnx>=2.0",
    "numpy>=2.0",
    "httpx[http2]>=0.28",
    "anthropic>=0.80",
]

[project.scripts]
wispd = "wispd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wispd"]
